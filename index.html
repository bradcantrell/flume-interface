<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flume Interface</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1116; --panel: #151b22; --panel2: #1c242d; --line: #2a3440; --text: #d7dee6; --dim: #8796a5;
    --accent: #f2c14e; --water: #5fc4d8; --danger: #e5735c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; min-width: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #16202a 0%, #0b0f14 75%); }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #ui { touch-action: none; }
  #banner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); max-width: 640px; padding: 10px 14px; border-radius: 8px;
    background: rgba(40, 24, 18, 0.92); border: 1px solid var(--danger); color: #f3d6cf; z-index: 5; }
  #toolbar { position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 9px; background: rgba(21, 27, 34, 0.88); border: 1px solid var(--line); z-index: 4; }
  #toolbar button { width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; display: grid; place-items: center; }
  #toolbar button:hover { background: var(--panel2); }
  #toolbar button.on { background: var(--accent); color: #1b1408; }
  #toolbar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #hint { position: absolute; left: 12px; bottom: 12px; color: var(--dim); font-size: 12px; pointer-events: none; z-index: 4; text-shadow: 0 1px 2px #000; }
  aside { width: 290px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 20px; }
  @media (max-width: 900px) { #app { flex-direction: column; } aside { width: 100%; height: 42%; border-left: 0; border-top: 1px solid var(--line); } }
  h1 { font-size: 15px; margin: 0 0 10px; letter-spacing: 0.02em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
  .row label { color: var(--dim); flex: 1; }
  input[type=number], select { width: 118px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  input[type=range] { width: 118px; }
  .btns { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
  .btns button, button.wide { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer; }
  .btns button:hover, button.wide:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); font-weight: 600; }
  #model-controls, #mat-props { display: contents; }
  #stats { font-variant-numeric: tabular-nums; }
  #stats .row { margin: 2px 0; }
  #stats .row span:last-child { color: var(--text); }
  #keys { color: var(--dim); font-size: 12px; margin-top: 14px; line-height: 1.6; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; color: var(--text); }
  .note { color: var(--dim); font-size: 12px; margin: 4px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="bg"></canvas>
    <canvas id="gpu"></canvas>
    <canvas id="ui"></canvas>
    <div id="banner" hidden></div>
    <div id="toolbar">
      <button data-tool="select" title="Select, move, resize (1)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
      <button data-tool="brush" title="Brush (2)"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 5-2 5-5l9-9a2 2 0 0 0-3-3l-9 9c-3 0-5 2-2 8z"/></svg></button>
      <button data-tool="line" title="Line (3)"><svg viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg></button>
      <button data-tool="poly" title="Polygon (4)"><svg viewBox="0 0 24 24"><path d="M4 18l4-12 8 2 4 9-9 3z"/></svg></button>
      <button data-tool="rect" title="Rectangle (5)"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1"/></svg></button>
      <button data-tool="ellipse" title="Ellipse (6)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="5.5"/></svg></button>
      <button data-tool="erase" title="Eraser, carves water (7)"><svg viewBox="0 0 24 24"><path d="M8 20h12M5 15l8-9 6 6-8 8H9z"/></svg></button>
      <button data-tool="bed" title="Edit the bed profile (8)"><svg viewBox="0 0 24 24"><path d="M3 16c4-5 6 1 9-3s5-1 9-4"/><circle cx="12" cy="13" r="1.6"/></svg></button>
    </div>
    <div id="hint"></div>
  </div>
  <aside>
    <h1>Flume Interface</h1>
    <div class="btns">
      <button id="run" class="primary">run</button>
      <button id="restart">restart</button>
      <select id="speed" title="model seconds per real second"><option value="0.25">¼ speed</option><option value="0.5">½ speed</option><option value="1" selected>real time</option><option value="2">2× speed</option><option value="4">4× speed</option></select>
    </div>

    <h2>Water</h2>
    <div id="model-controls"></div>

    <h2>Flume</h2>
    <div class="row"><label for="scale">scale</label><select id="scale"><option value="lab">lab</option><option value="field">field</option></select></div>
    <div class="row"><label for="len">length (m)</label><input id="len" type="number" step="any" min="0.5"></div>
    <div class="row"><label for="hgt">height (m)</label><input id="hgt" type="number" step="any" min="0.05"></div>
    <div class="row"><label for="res">resolution</label><select id="res"><option value="draft">draft</option><option value="normal">normal</option><option value="fine">fine</option></select></div>

    <h2>Material</h2>
    <div class="row"><label for="mat">draw with</label><select id="mat"></select></div>
    <div id="mat-props"></div>
    <div class="row"><label for="brush">brush width</label><input id="brush" type="range" min="2" max="80" value="14"></div>
    <p class="note" id="sel-note"></p>

    <h2>Bed</h2>
    <div class="row"><label for="bed-cls">bed sediment</label><select id="bed-cls"></select></div>
    <div class="row"><label for="bed-slope">slope (%)</label><input id="bed-slope" type="number" step="0.1" value="0"></div>
    <div class="btns"><button id="bed-flat">flat</button><button id="bed-apply-slope">apply slope</button><button id="bed-smooth">smooth</button></div>

    <h2>Scene</h2>
    <div class="btns">
      <button id="undo">undo</button><button id="save">save</button><button id="open">open</button><button id="clear">clear</button>
      <input id="open-file" type="file" accept=".json,application/json" hidden>
    </div>
    <div id="site-slot"></div>

    <h2>Readouts</h2>
    <div id="stats"></div>

    <div id="keys">
      <kbd>Space</kbd> run/pause &middot; <kbd>R</kbd> restart &middot; <kbd>1</kbd>–<kbd>8</kbd> tools<br>
      <kbd>Del</kbd> delete shape &middot; <kbd>[</kbd> <kbd>]</kbd> send back/forward<br>
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo &middot; <kbd>Esc</kbd> cancel<br>
      wheel zoom &middot; middle-drag or arrows pan &middot; <kbd>Alt</kbd>+wheel vertical scale &middot; <kbd>0</kbd> fit
      <span id="help-site"></span>
    </div>
  </aside>
</div>

<script id="interface">
'use strict';
// ═════════════════════════════════════════════════════════════════════════════
// FLUME INTERFACE
// The section view, the drawing tools, the material raster, the bed and the scene.
// It knows nothing about how water moves: that is model.js, through the MODEL EXTENSION
// POINT at the end of this script. What a repo does with the scene is site.js (SITE
// EXTENSION POINT).
//
// World coordinates are metres: x along the flume (0..L), z up from the floor (0..H).
// Shapes are kept as vectors in metres and are the source of truth; the grid (GRID, RASTER)
// is rasterized from them, so changing resolution or scale loses nothing.
// ═════════════════════════════════════════════════════════════════════════════

// ───────── materials ─────────
const MAT = { FLUID: 0, SOLID: 1, POROUS: 2, CANOPY: 3, SEDIMENT: 4 };
const GRAIN = [
  { label: 'fine sand', d: 0.0002, color: [214, 193, 150] },
  { label: 'coarse sand', d: 0.001, color: [190, 150, 88] },
  { label: 'gravel', d: 0.01, color: [132, 120, 106] },
];
// props: [key, label, min, max, step, lab default, field default]
const MAT_INFO = {
  1: { label: 'solid', props: [] },
  2: { label: 'porous (rock, reef)', props: [['n', 'porosity', 0.1, 0.9, 0.01, 0.4, 0.4], ['d', 'stone size (m)', 0.001, 5, 0.001, 0.04, 0.8]] },
  3: { label: 'plants (canopy)', props: [['a', 'frontal area (1/m)', 0.1, 200, 0.1, 8, 1.5], ['cd', 'drag coefficient', 0.2, 3, 0.05, 1.0, 1.0], ['stem', 'stem diameter (m)', 0.0005, 1, 0.0005, 0.006, 0.05]] },
  4: { label: 'sediment', props: [['cls', 'grain class', 0, 2, 1, 0, 0]] },
};

// ───────── domain and grid ─────────
const RES_FACTOR = { draft: 2, normal: 1.4, fine: 1 };
let DOMAIN = { scale: 'lab', L: 20, H: 1.0, res: 'normal' };
let GRID = null;          // { nx, nz, dx }
let RASTER = null;        // { nx, nz, dx, mat: Uint8, p1, p2, p3: Float32, cls: Uint8 }

function domainDefaults(scale) {
  if (model && model.domain) return model.domain(scale);
  return scale === 'field' ? { L: 400, H: 16, dx: 0.2 } : { L: 20, H: 1.0, dx: 0.01 };
}
function gridFor(dom) {
  const base = domainDefaults(dom.scale).dx * (RES_FACTOR[dom.res] || 1.4);
  const nx = Math.max(16, Math.round(dom.L / base));
  const dx = dom.L / nx;
  const nz = Math.max(8, Math.round(dom.H / dx));
  return { nx, nz, dx };
}

// ───────── scene ─────────
// shapes: { id, kind: 'rect'|'ellipse'|'poly'|'stroke', pts: [[x,z],...], w (stroke width, m),
//           mat, props: {...} }. rect and ellipse keep two corner points.
let scene = { bed: { pts: [[0, 0.1], [20, 0.1]], cls: 0 }, shapes: [] };
let nextId = 1;

function defaultBed(dom) { const z = +(dom.H * 0.1).toFixed(4); return { pts: [[0, z], [dom.L, z]], cls: 0 }; }
function bedZ(x) {
  const p = scene.bed.pts;
  if (x <= p[0][0]) return p[0][1];
  for (let j = 1; j < p.length; j++) if (x <= p[j][0]) { const a = p[j - 1], b = p[j], t = (x - a[0]) / Math.max(b[0] - a[0], 1e-9); return a[1] + t * (b[1] - a[1]); }
  return p[p.length - 1][1];
}
function propDefaults(mat) {
  const info = MAT_INFO[mat], o = {}; if (!info) return o;
  for (const pr of info.props) o[pr[0]] = DOMAIN.scale === 'field' ? pr[6] : pr[5];
  return o;
}

// ───────── geometry ─────────
function bboxOf(sh) {
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
  for (const [x, z] of sh.pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  const h = sh.kind === 'stroke' ? (sh.w || 0) / 2 : 0;
  return { x0: x0 - h, z0: z0 - h, x1: x1 + h, z1: z1 + h };
}
function distSeg(px, pz, a, b) {
  const vx = b[0] - a[0], vz = b[1] - a[1], L2 = vx * vx + vz * vz;
  let t = L2 > 0 ? ((px - a[0]) * vx + (pz - a[1]) * vz) / L2 : 0; t = Math.max(0, Math.min(1, t));
  const dx = px - (a[0] + t * vx), dz = pz - (a[1] + t * vz); return Math.sqrt(dx * dx + dz * dz);
}
function contains(sh, x, z) {
  const p = sh.pts;
  if (sh.kind === 'rect') { const x0 = Math.min(p[0][0], p[1][0]), x1 = Math.max(p[0][0], p[1][0]), z0 = Math.min(p[0][1], p[1][1]), z1 = Math.max(p[0][1], p[1][1]); return x >= x0 && x <= x1 && z >= z0 && z <= z1; }
  if (sh.kind === 'ellipse') {
    const cx = (p[0][0] + p[1][0]) / 2, cz = (p[0][1] + p[1][1]) / 2, rx = Math.abs(p[1][0] - p[0][0]) / 2, rz = Math.abs(p[1][1] - p[0][1]) / 2;
    if (rx <= 0 || rz <= 0) return false; const u = (x - cx) / rx, v = (z - cz) / rz; return u * u + v * v <= 1;
  }
  if (sh.kind === 'poly') {
    let inside = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const xi = p[i][0], zi = p[i][1], xj = p[j][0], zj = p[j][1];
      if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
    }
    return inside;
  }
  if (sh.kind === 'stroke') {
    const r = (sh.w || 0) / 2;
    if (p.length === 1) return Math.hypot(x - p[0][0], z - p[0][1]) <= r;
    for (let j = 1; j < p.length; j++) if (distSeg(x, z, p[j - 1], p[j]) <= r) return true;
    return false;
  }
  return false;
}

// ───────── raster ─────────
function rasterize() {
  const { nx, nz, dx } = GRID, N = nx * nz;
  if (!RASTER || RASTER.nx !== nx || RASTER.nz !== nz) RASTER = { nx, nz, dx, mat: new Uint8Array(N), p1: new Float32Array(N), p2: new Float32Array(N), p3: new Float32Array(N), cls: new Uint8Array(N) };
  const R = RASTER; R.dx = dx; R.mat.fill(0); R.p1.fill(0); R.p2.fill(0); R.p3.fill(0); R.cls.fill(0);
  // the bed: everything under the profile is sediment of the bed's class
  for (let i = 0; i < nx; i++) {
    const zb = bedZ((i + 0.5) * dx), kb = Math.min(nz, Math.round(zb / dx));
    for (let k = 0; k < kb; k++) { const c = i + nx * k; R.mat[c] = MAT.SEDIMENT; R.cls[c] = scene.bed.cls; }
  }
  // shapes, in order: later shapes cover earlier ones; the eraser writes water. Plants and
  // porous rock only take water cells: they stand on the bed and on solids, never replace them.
  for (const sh of scene.shapes) {
    const onlyWater = sh.mat === MAT.POROUS || sh.mat === MAT.CANOPY;
    const b = bboxOf(sh);
    const i0 = Math.max(0, Math.floor(b.x0 / dx - 0.5)), i1 = Math.min(nx - 1, Math.ceil(b.x1 / dx - 0.5));
    const k0 = Math.max(0, Math.floor(b.z0 / dx - 0.5)), k1 = Math.min(nz - 1, Math.ceil(b.z1 / dx - 0.5));
    const pr = sh.props || {};
    for (let k = k0; k <= k1; k++) for (let i = i0; i <= i1; i++) {
      if (!contains(sh, (i + 0.5) * dx, (k + 0.5) * dx)) continue;
      const c = i + nx * k;
      if (onlyWater && (R.mat[c] === MAT.SOLID || R.mat[c] === MAT.SEDIMENT)) continue;
      R.mat[c] = sh.mat; R.p1[c] = 0; R.p2[c] = 0; R.p3[c] = 0; R.cls[c] = 0;
      if (sh.mat === MAT.POROUS) { R.p1[c] = pr.n; R.p2[c] = pr.d; }
      else if (sh.mat === MAT.CANOPY) { R.p1[c] = pr.a; R.p2[c] = pr.cd; R.p3[c] = pr.stem; }
      else if (sh.mat === MAT.SEDIMENT) { R.cls[c] = pr.cls | 0; }
    }
  }
  return R;
}
function rasterHash() { let h = 2166136261; const m = RASTER.mat, c = RASTER.cls; for (let i = 0; i < m.length; i++) { h ^= m[i] * 7 + c[i]; h = Math.imul(h, 16777619); } return h >>> 0; }

// ───────── view ─────────
// screen (CSS px) = ((x - x0) * s, ch - (z - z0) * s * ve)
let view = { x0: 0, z0: 0, s: 50, ve: 1, cw: 800, ch: 400, dpr: 1 };
let viewFitted = true;
function fitView() {
  const { L, H } = DOMAIN, cw = view.cw, ch = view.ch;
  const s = cw / (L * 1.04);
  const ve = Math.max(1, Math.min(40, (ch * 0.62) / (H * s)));
  view.s = s; view.ve = +ve.toFixed(ve < 10 ? 1 : 0);
  view.x0 = -0.02 * L; view.z0 = -(ch / (s * view.ve) - H) / 2;
  viewFitted = true;
}
function w2s(x, z) { return [(x - view.x0) * view.s, view.ch - (z - view.z0) * view.s * view.ve]; }
function s2w(X, Y) { return [view.x0 + X / view.s, view.z0 + (view.ch - Y) / (view.s * view.ve)]; }
function zoomAt(X, Y, factor) {
  const [x, z] = s2w(X, Y);
  view.s = Math.max(view.cw / (DOMAIN.L * 4), Math.min(view.s * factor, 20 * view.cw / Math.max(GRID.dx * 40, 1e-6)));
  view.x0 = x - X / view.s; view.z0 = z - (view.ch - Y) / (view.s * view.ve); viewFitted = false;
}
function setVE(X, Y, factor) {
  const [, z] = s2w(X, Y);
  view.ve = Math.max(1, Math.min(60, view.ve * factor)); view.z0 = z - (view.ch - Y) / (view.s * view.ve); viewFitted = false;
}

// ───────── state ─────────
let tool = 'select';
let curMat = MAT.SOLID;
let curProps = { 1: {}, 2: propDefaults(2), 3: propDefaults(3), 4: propDefaults(4) };
let selected = null;          // shape id
let drag = null;              // current pointer action
let polyPts = null;           // polygon being drawn
let running = false;
let undoStack = [];
let lastFrame = 0;
const STORE_KEY = 'flume-interface-scene';

function shapeById(id) { return scene.shapes.find(s => s.id === id) || null; }
function snapshot() { return JSON.stringify({ bed: scene.bed, shapes: scene.shapes }); }
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 80) undoStack.shift(); }
function undo() {
  if (!undoStack.length) return;
  const s = JSON.parse(undoStack.pop()); scene.bed = s.bed; scene.shapes = s.shapes;
  if (selected && !shapeById(selected)) selected = null;
  sceneChanged();
}

// Every edit ends here: rebuild the raster, tell the model, redraw the materials, save.
function sceneChanged() {
  rasterize();
  if (model && model.setRaster) model.setRaster(RASTER);
  buildMatImage(); buildStems();
  saveLocal(); updatePanel();
}

// ───────── material image (one pixel per cell) ─────────
let matCanvas = null, matCtx = null, stems = [];
function hash2(i, k) { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); }
function buildMatImage() {
  const { nx, nz } = GRID;
  if (!matCanvas) { matCanvas = document.createElement('canvas'); }
  if (matCanvas.width !== nx || matCanvas.height !== nz) { matCanvas.width = nx; matCanvas.height = nz; }
  matCtx = matCanvas.getContext('2d', { willReadFrequently: true });   // a CPU canvas: a GPU reset cannot wipe it
  const img = matCtx.createImageData(nx, nz), d = img.data, R = RASTER;
  for (let k = 0; k < nz; k++) for (let i = 0; i < nx; i++) {
    const c = i + nx * k, o = 4 * (i + nx * (nz - 1 - k)), m = R.mat[c];
    let r = 0, g = 0, b = 0, a = 0;
    if (m === MAT.SOLID) { const n = (hash2(i, k) - 0.5) * 10; r = 74 + n; g = 80 + n; b = 89 + n; a = 255; }
    else if (m === MAT.SEDIMENT) {
      const gr = GRAIN[R.cls[c]] || GRAIN[0], sc = R.cls[c] === 2 ? 3 : R.cls[c] === 1 ? 2 : 1;
      const n = (hash2(Math.floor(i / sc), Math.floor(k / sc)) - 0.5) * (R.cls[c] === 2 ? 46 : 22) + (hash2(i, k) - 0.5) * 8;
      r = gr.color[0] + n; g = gr.color[1] + n; b = gr.color[2] + n; a = 255;
    } else if (m === MAT.POROUS) {
      const cps = Math.max(1, (R.p2[c] || 0.04) / GRID.dx), q = hash2(Math.floor(i / cps), Math.floor(k / cps));
      if (q > (R.p1[c] || 0.4)) { const n = (q - 0.5) * 40 + (hash2(i, k) - 0.5) * 10; r = 128 + n; g = 118 + n; b = 104 + n; a = 240; }
      else { r = 30; g = 40; b = 46; a = 60; }
    } else if (m === MAT.CANOPY) { r = 70; g = 150; b = 80; a = 30; }
    d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = a;
  }
  matCtx.putImageData(img, 0, 0);
}
function matAt(x, z) {
  const i = Math.floor(x / GRID.dx), k = Math.floor(z / GRID.dx);
  if (i < 0 || k < 0 || i >= GRID.nx || k >= GRID.nz) return -1;
  return RASTER.mat[i + GRID.nx * k];
}
// plant stems as lines, spaced by stem density (at least a few pixels apart when drawn)
function buildStems() {
  stems = [];
  for (const sh of scene.shapes) {
    if (sh.mat !== MAT.CANOPY) continue;
    const b = bboxOf(sh), pr = sh.props || {}, a = Math.max(pr.a || 8, 0.01), stem = Math.max(pr.stem || 0.006, 1e-4);

    const dz = GRID.dx * 0.5;

  let s = null; try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; }
  if (s && !validScene(s)) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} return null; }
  return s;
}
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// ───────── sidebar ─────────
function syncDomainInputs() {
  const $ = (id) => document.getElementById(id);
  $('scale').value = DOMAIN.scale; $('len').value = String(+DOMAIN.L.toFixed(3)); $('hgt').value = String(+DOMAIN.H.toFixed(3)); $('res').value = DOMAIN.res;
}
function updatePanel() {
  const sel = shapeById(selected), mat = sel ? sel.mat : curMat, props = sel ? sel.props : curProps[curMat];
  const $ = (id) => document.getElementById(id);
  $('mat').value = String(mat === MAT.FLUID ? 0 : mat);
  const info = MAT_INFO[mat]; let html = '';
  if (info) for (const pr of info.props) {
    if (pr[0] === 'cls') html += `<div class="row"><label for="mp-cls">${pr[1]}</label><select id="mp-cls" data-k="cls">${GRAIN.map((g, j) => `<option value="${j}"${(props.cls | 0) === j ? ' selected' : ''}>${g.label}</option>`).join('')}</select></div>`;
    else html += `<div class="row"><label for="mp-${pr[0]}">${pr[1]}</label><input id="mp-${pr[0]}" data-k="${pr[0]}" type="number" min="${pr[2]}" max="${pr[3]}" step="${pr[4]}" value="${props[pr[0]]}"></div>`;
  }
  $('mat-props').innerHTML = html;
  for (const el of $('mat-props').querySelectorAll('[data-k]')) el.addEventListener('change', onPropChange);
  $('sel-note').textContent = sel ? 'Editing the selected ' + (sel.mat === MAT.FLUID ? 'eraser' : MAT_INFO[sel.mat].label) + ' shape.' : (tool === 'select' ? 'Click a shape to select it.' : '');
  $('hint').textContent = HINTS[tool] || '';
  for (const b of document.querySelectorAll('#toolbar button')) b.classList.toggle('on', b.dataset.tool === tool);
}
function onPropChange(e) {
  const k = e.target.dataset.k, info = MAT_INFO[(shapeById(selected) || { mat: curMat }).mat];
  const pr = info && info.props.find(p => p[0] === k); if (!pr) return;
  let v = parseFloat(e.target.value); if (!isFinite(v)) { updatePanel(); return; }
  v = Math.max(pr[2], Math.min(pr[3], v)); if (k === 'cls') v = v | 0;
  const sel = shapeById(selected);
  if (sel) { pushUndo(); sel.props[k] = v; sceneChanged(); } else { curProps[curMat][k] = v; }
}
const HINTS = {
  select: 'Click a shape to select it. Drag to move, drag a handle to resize.',
  brush: 'Drag to paint with the chosen material.',
  line: 'Drag from one end to the other.',
  poly: 'Click to add corners. Click the first corner, double-click or press Enter to close.',
  rect: 'Drag a rectangle.', ellipse: 'Drag an ellipse.',
  erase: 'Drag to carve back to water. It cuts the bed too.',
  // plants and porous rock fill water only; see rasterize()
  bed: 'Drag a point to reshape the bed. Click the line to add a point, right-click a point to remove it.',
};
function setTool(t) { if (polyPts && t !== 'poly') finishPoly(); tool = t; if (t !== 'select') selected = null; updatePanel(); }

function setRunning(v) { running = !!v; document.getElementById('run').textContent = running ? 'pause' : 'run'; }
function restart() { if (model && model.reset) model.reset(); }
let statsAt = 0;
function updateStats(now) {
  if (now - statsAt < 250) return; statsAt = now;
  const rows = (model && model.readouts ? model.readouts() : []).concat([['shapes', String(scene.shapes.length)]]);
  document.getElementById('stats').innerHTML = rows.map(([a, b]) => `<div class="row"><span>${a}</span><span>${b}</span></div>`).join('');
}

// ───────── loop ─────────
function frame(now) {
  const dt = lastFrame ? (now - lastFrame) / 1000 : 0; lastFrame = now;
  if (model) model.frame(dt, running);
  drawBackground();
  if (model) model.render(view);
  drawUI(now);
  for (const b of backends) if (b.frame) b.frame();
  updateStats(now);
  requestAnimationFrame(frame);
}

function onKey(e) {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); undo(); return; }
  if (k === ' ') { e.preventDefault(); setRunning(!running); return; }
  if (k === 'r' || k === 'R') { restart(); return; }
  if (k >= '1' && k <= '8') { setTool(['select', 'brush', 'line', 'poly', 'rect', 'ellipse', 'erase', 'bed'][+k - 1]); return; }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
  if (k === 'Escape') { polyPts = null; drag = null; selected = null; updatePanel(); return; }
  if (k === 'Enter') { finishPoly(); return; }
  if (k === '[') { reorderSelected(-1); return; } if (k === ']') { reorderSelected(1); return; }
  if (k === '0') { fitView(); return; }
  const pan = 60;
  if (k === 'ArrowLeft') { view.x0 -= pan / view.s; viewFitted = false; return; }
  if (k === 'ArrowRight') { view.x0 += pan / view.s; viewFitted = false; return; }
  if (k === 'ArrowUp') { view.z0 += pan / (view.s * view.ve); viewFitted = false; return; }
  if (k === 'ArrowDown') { view.z0 -= pan / (view.s * view.ve); viewFitted = false; return; }
  const lk = k.toLowerCase();
  if (model && model.keys && model.keys[lk]) { model.keys[lk](); return; }
  for (const b of backends) if (b.keys && b.keys[lk]) { b.keys[lk](); return; }
}

function wire() {
  const $ = (id) => document.getElementById(id);
  cvBg = $('bg'); cvGpu = $('gpu'); cvUi = $('ui');
  bgCtx = cvBg.getContext('2d'); uiCtx = cvUi.getContext('2d');
  cvUi.addEventListener('pointerdown', (e) => { try { cvUi.setPointerCapture(e.pointerId); } catch (x) {} onDown(e); });
  cvUi.addEventListener('pointermove', onMove);
  cvUi.addEventListener('pointerup', onUp);
  cvUi.addEventListener('pointercancel', () => { drag = null; });
  cvUi.addEventListener('pointerleave', () => { hover = null; });
  cvUi.addEventListener('dblclick', () => { if (tool === 'poly') { if (polyPts) polyPts.pop(); finishPoly(); } });
  cvUi.addEventListener('contextmenu', (e) => e.preventDefault());
  cvUi.addEventListener('wheel', (e) => { e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0015); if (e.altKey) setVE(e.offsetX, e.offsetY, f); else zoomAt(e.offsetX, e.offsetY, f); }, { passive: false });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);
  for (const b of document.querySelectorAll('#toolbar button')) b.addEventListener('click', () => setTool(b.dataset.tool));
  $('mat').innerHTML = [1, 2, 3, 4].map(m => `<option value="${m}">${MAT_INFO[m].label}</option>`).join('');
  $('mat').addEventListener('change', (e) => {
    const m = +e.target.value, sel = shapeById(selected);
    if (sel) { pushUndo(); sel.mat = m; sel.props = Object.assign({}, curProps[m] || {}); sceneChanged(); } else { curMat = m; updatePanel(); }
  });
  $('bed-cls').innerHTML = GRAIN.map((g, j) => `<option value="${j}">${g.label}</option>`).join('');
  $('bed-cls').addEventListener('change', (e) => { pushUndo(); scene.bed.cls = +e.target.value; sceneChanged(); });
  $('bed-flat').addEventListener('click', bedFlat);
  $('bed-smooth').addEventListener('click', bedSmooth);
  $('bed-apply-slope').addEventListener('click', () => { const v = parseFloat($('bed-slope').value); if (isFinite(v)) bedSlope(v); });
  $('scale').addEventListener('change', (e) => setScale(e.target.value));
  $('len').addEventListener('change', (e) => { const v = parseFloat(e.target.value); if (isFinite(v) && v > 0) setDomain({ L: v }); else syncDomainInputs(); });
  $('hgt').addEventListener('change', (e) => { const v = parseFloat(e.target.value); if (isFinite(v) && v > 0) setDomain({ H: v }); else syncDomainInputs(); });
  $('res').addEventListener('change', (e) => setDomain({ res: e.target.value }, false));
  $('run').addEventListener('click', () => setRunning(!running));
  $('restart').addEventListener('click', restart);
  $('speed').addEventListener('change', (e) => { if (model && model.p) model.p.speed = +e.target.value; });
  $('undo').addEventListener('click', undo);
  $('save').addEventListener('click', () => download('scene.json', sceneFileText()));
  $('open').addEventListener('click', () => $('open-file').click());
  $('open-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    f.text().then((t) => { if (!openSceneText(t)) alert('That file is not a flume scene.'); e.target.value = ''; });
  });
  $('clear').addEventListener('click', () => { pushUndo(); scene.shapes = []; scene.bed = defaultBed(DOMAIN); selected = null; sceneChanged(); });
}

// ═════════════════════════════════════════════════════════════════════════════
// MODEL EXTENSION POINT
// model.js registers one model. The interface hands it the grid and the material raster
// and asks it to move and draw the water:
//
//   registerModel({
//     id: 'flume',                         // required
//     async init(api) -> { ok, reason },   // api: { canvas (the #gpu canvas), changed() };
//                                          // a model that cannot run says why (shown in a banner)
//     domain(scale) -> { L, H, dx },       // optional: default size and cell size per scale
//     setScale(scale),                     // optional: 'lab' | 'field'
//     setGrid(grid, raster),               // required: a new grid { nx, nz, dx } (re)allocates
//     setRaster(raster),                   // required: the materials changed on the same grid
//     reset(),                             // required: back to the starting water
//     frame(dtWall, running),              // required: once per animation frame
//     render(view),                        // required: draw the water into the #gpu canvas
//     readouts() -> [[label, value], ...], // optional
//     state() / setState(obj),             // optional: saved with the scene
//     controls: { html, wire() },          // optional: mounted into #model-controls
//     keys: { k: fn },                     // optional
//   });
//
// The raster: nx x nz cells, index i + nx * k (k = 0 at the floor), cell size dx metres.
//   mat[c]: 0 water/air, 1 solid, 2 porous, 3 canopy, 4 sediment
//   porous:   p1 = porosity, p2 = stone size (m)
//   canopy:   p1 = frontal area per volume (1/m), p2 = drag coefficient, p3 = stem diameter (m)
//   sediment: cls = grain class (index into GRAIN)
// The view: { x0, z0, s (CSS px per metre), ve (vertical exaggeration), cw, ch (CSS px), dpr };
// a world point (x, z) is at ((x - x0) * s, ch - (z - z0) * s * ve) in CSS px.
// ═════════════════════════════════════════════════════════════════════════════
let model = null;
function registerModel(m) {
  if (model) throw new Error('registerModel: a model is already registered (' + model.id + ')');
  for (const k of ['id', 'init', 'setGrid', 'setRaster', 'reset', 'frame', 'render']) if (!m || !m[k]) throw new Error('registerModel: a model needs ' + k);
  model = m;
}

// ═════════════════════════════════════════════════════════════════════════════
// SITE EXTENSION POINT
// site.js registers backends: { id, title?, mount(slot)?, frame()?, keys?, help? }.
// captureScene() is the one description of the scene; sceneFileText() is it as a file.
// ═════════════════════════════════════════════════════════════════════════════
const backends = [];
function registerBackend(b) {
  if (!b || !b.id) throw new Error('registerBackend: a backend needs an id');
  if (backends.some(x => x.id === b.id)) throw new Error('registerBackend: duplicate id ' + b.id);
  backends.push(b);
}

// a short message in the banner that fades (the model uses it to say the GPU was reset)
let noteTimer = null;
function showNote(text) {
  const bn = document.getElementById('banner'); bn.textContent = text; bn.hidden = false;
  clearTimeout(noteTimer); noteTimer = setTimeout(() => { bn.hidden = true; }, 6000);
}

// ───────── boot ─────────
let booted = false;
async function boot() {
  wire();
  const saved = loadLocal();
  if (model && model.controls) {
    if (model.controls.html) document.getElementById('model-controls').innerHTML = model.controls.html;
  }
  const readback = /[?&]readback\b/.test((typeof location !== 'undefined' && location.search) || '');
  const res = model ? await model.init({ canvas: cvGpu, changed: saveLocal, notify: showNote, readback }) : { ok: false, reason: 'No model is loaded.' };
  if (!res.ok) { const bn = document.getElementById('banner'); bn.textContent = res.reason || 'The model could not start.'; bn.hidden = false; }
  if (model && model.controls && model.controls.wire) model.controls.wire();
  resize();
  GRID = gridFor(DOMAIN);
  if (!(saved && applyScene(saved))) { scene.bed = defaultBed(DOMAIN); setDomain({}, false); }
  if (model && model.p) document.getElementById('speed').value = String(model.p.speed || 1);
  for (const b of backends) {
    if (b.title) document.title = b.title;
    if (b.mount) b.mount(document.getElementById('site-slot'));
    if (b.help) document.getElementById('help-site').innerHTML += ' &middot; ' + b.help;
  }
  setTool('select');
  booted = true;
  requestAnimationFrame(frame);
}
window.addEventListener('load', () => { boot().catch((e) => { console.error(e); const bn = document.getElementById('banner'); bn.textContent = 'Start-up failed: ' + e.message; bn.hidden = false; }); });
</script>
<script src="model.js"></script>
<script src="site.js"></script>
