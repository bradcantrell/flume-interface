<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flume Bench</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0d1116; --text: #d7dee6; --dim: #8796a5; --line: #2a3440; --accent: #f2c14e; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: var(--dim); margin: 4px 0 14px; }
  button { background: var(--accent); color: #1b1408; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 600; }
  #status { margin-top: 12px; color: var(--dim); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Flume bench</h1>
  <p>Times the flume's GPU step on this computer at five grid sizes (a wave flume with a submerged breakwater). It takes about a minute. Real time needs the "model s per s" column at 1 or more.</p>
  <button id="go">run the bench</button>
  <div id="status"></div>
  <table id="out" hidden><thead><tr><th>grid</th><th>cells</th><th>ms per step</th><th>model s per s</th></tr></thead><tbody></tbody></table>
</main>
<script>
let M = null;
function registerModel(m) { M = m; }
</script>
<script src="../model.js"></script>
<script>
const status = document.getElementById('status');
document.getElementById('go').addEventListener('click', async () => {
  document.getElementById('go').disabled = true;
  const r = await M.init({});
  if (!r.ok) { status.textContent = r.reason; return; }
  const info = M.adapter && M.adapter.info ? [M.adapter.info.vendor, M.adapter.info.architecture, M.adapter.info.description].filter(Boolean).join(' / ') : '';
  status.textContent = 'GPU: ' + (info || 'unknown') + '\n' + navigator.userAgent;
  const tb = document.querySelector('#out tbody'); document.getElementById('out').hidden = false;
  for (const [L, H, dx] of [[20, 0.8, 0.05], [20, 0.8, 0.025], [30, 1.2, 0.025], [20, 1.0, 0.0125], [30, 1.2, 0.0125]]) {
    const nx = Math.round(L / dx), nz = Math.round(H / dx), N = nx * nz;
    const ras = { nx, nz, dx, mat: new Uint8Array(N), p1: new Float32Array(N), p2: new Float32Array(N), p3: new Float32Array(N), cls: new Uint8Array(N) };
    for (let k = 0; k < nz; k++) for (let i = 0; i < nx; i++) { const x = (i + 0.5) * dx, z = (k + 0.5) * dx; if (z < 0.05 * H || (Math.abs(x - 0.55 * L) < 1.2 - 0.9 * z / (0.35 * H) && z < 0.35 * H)) ras.mat[i + nx * k] = 1; }
    M.setScale('lab'); Object.assign(M.p, { type: 'wave', h0: 0.5 * H, H: 0.05, T: 1.6 });
    M.setGrid({ nx, nz, dx }, ras); M.reset();
    const dt = 0.4 * dx / 1.0;
    await M.debug.steps(20, dt);                      // warm up
    const steps = 150, t0 = performance.now();
    await M.debug.steps(steps, dt);
    const ms = (performance.now() - t0) / steps;
    const row = document.createElement('tr');
    row.innerHTML = `<td>${nx} × ${nz}</td><td>${(N / 1000).toFixed(0)}k</td><td>${ms.toFixed(2)}</td><td>${(dt * 1000 / ms).toFixed(2)}</td>`;
    tb.appendChild(row);
  }
  status.textContent += '\nDone.';
});
</script>
</body>
</html>
